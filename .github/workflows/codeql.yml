name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '26 14 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }})
    runs-on: 'ubuntu-24.04'
    permissions:
      # required to upload code scanning results
      security-events: write
      # required for private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        # Privilege elevation code is selected at compile time (WS_CAPA), so both
        # variants have to be built for CodeQL to see all code paths.
        - language: cpp
          build-mode: manual
          variant: capabilities
          ws_use_capabilities: "ON"
        - language: cpp
          build-mode: manual
          variant: suid
          ws_use_capabilities: "OFF"
        # scan the workflow files themselves (injection, permissions, ...)
        - language: actions
          build-mode: none

    steps:
    - name: Install OS package dependencies
      if: matrix.language == 'cpp'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libboost-system-dev \
          libboost-program-options-dev \
          libcurl4-openssl-dev \
          libcap-dev

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # security-and-quality is a superset of security-extended (which in turn
        # extends the default suite) - this is the most comprehensive standard suite
        queries: security-and-quality

    - name: Build code
      if: matrix.build-mode == 'manual'
      run: |
        cmake --preset release -DWS_USE_CAPABILITIES=${{ matrix.ws_use_capabilities }}
        cmake --build --preset release -j

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}${{ matrix.variant && format('/variant:{0}', matrix.variant) || '' }}"
        output: sarif-results
        upload: failure-only

    # Dependencies fetched via FetchContent are compiled as part of the build and
    # thus extracted by CodeQL. The paths/paths-ignore config options have no
    # effect for compiled languages, so results are filtered after analysis.
    - name: Filter CodeQL results
      if: matrix.language == 'cpp'
      uses: advanced-security/filter-sarif@v1
      with:
        patterns: |
          -fetchdeps/**
          -_deps/**
          -external/**
          -build/**
          -vcpkg/**
          -vcpkg_installed/**
        input: sarif-results/cpp.sarif
        output: sarif-results/cpp.sarif

    - name: Upload SARIF as a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: sarif-results-${{ matrix.language }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
        path: sarif-results
        retention-days: 7

    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: sarif-results
        category: "/language:${{ matrix.language }}${{ matrix.variant && format('/variant:{0}', matrix.variant) || '' }}"
