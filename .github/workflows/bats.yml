name: "Tests"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit tests (${{ matrix.cmake_preset }})
    runs-on: 'ubuntu-24.04'

    strategy:
      fail-fast: false
      matrix:
        # only presets with BUILD_TESTS and a matching test preset
        cmake_preset: ["debug"]

    steps:
    - name: Install OS package dependencies to build hpc-workspace
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libboost-system-dev \
          libboost-program-options-dev \
          libcurl4-openssl-dev \
          libcap-dev

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Configure and build code
      run: |
        cmake --preset ${{ matrix.cmake_preset }}
        cmake --build --preset ${{ matrix.cmake_preset }} -j

    - name: Run unit tests
      run: |
        ctest --preset ${{ matrix.cmake_preset }} --output-on-failure

  cli-test:
    name: CLI tests (${{ matrix.cmake_preset }})
    runs-on: 'ubuntu-24.04'

    strategy:
      fail-fast: false
      matrix:
        cmake_preset: ["debug", "release"]

    steps:
    - name: Install OS package dependencies to build and test hpc-workspace
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libboost-system-dev \
          libboost-program-options-dev \
          libcurl4-openssl-dev \
          libcap-dev \
          postfix s-nail \
          bats bats-support bats-assert bats-file
        sudo sed -i 's/^inet_interfaces = localhost$/inet_interfaces = loopback-only/' /etc/postfix/main.cf
        sudo systemctl enable --now postfix

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Configure and build code
      run: |
        cmake --preset ${{ matrix.cmake_preset }}
        cmake --build --preset ${{ matrix.cmake_preset }} -j

    - name: Run bats non-sudo tests
      env:
        PRESET: ${{ matrix.cmake_preset }}
      run: |
        bats --filter-tags '!sudo' bats/test/

    - name: Run bats sudo tests
      env:
        PRESET: ${{ matrix.cmake_preset }}
      run: |
        sudo PRESET="$PRESET" bats --filter-tags sudo bats/test/
